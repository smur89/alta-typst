# Builds and publishes `ghcr.io/smur89/alta-typst-ci`, the CI/local
# image that carries Typst + Lato + FontAwesome 7. The image tag
# encodes both font versions so `build.yml` pins an exact, immutable
# environment per workflow run; bumping a version means rebuilding
# and editing the tag in `build.yml` to match.
#
# Triggers:
#   * `push` to main touching the Dockerfile / this workflow → build
#     and push the new tag.
#   * `pull_request` touching the same paths → build only, no push.
#     Verifies the Dockerfile still produces a working image before
#     the change lands on main.
#   * `workflow_dispatch` → manual rebuild (useful after a registry
#     incident, or to publish from a feature branch during the
#     initial rollout).
name: Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/image.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/image.yml
  workflow_dispatch:

# Each ref serializes its own image builds. Default branch builds
# don't cancel each other (we want every push to main to publish);
# PR validation runs cancel-on-replace to save runner minutes.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  # Push to ghcr.io/${owner}/* needs `packages: write`; everything
  # else stays read-only.
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/smur89/alta-typst-ci

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tag is derived from the Dockerfile so the Dockerfile stays
      # the single source of truth for what's in the image. All three
      # render-critical versions (Typst, FontAwesome, Lato) go into
      # the tag so a bump to *any* of them produces a distinct,
      # immutable tag — avoids the "same tag, different bytes" trap
      # if e.g. Lato is bumped on its own.
      - name: Derive image tag from Dockerfile
        id: tag
        run: |
          typst_version=$(grep -oE '^FROM ghcr\.io/typst/typst:[0-9.]+' Dockerfile | cut -d: -f2)
          fa_version=$(grep -oE '^ARG FA_VERSION=[0-9.]+' Dockerfile | cut -d= -f2)
          # Lato apk versions look like `2.015-r0` — accept letters,
          # digits, dots, hyphens, underscores after the `=`.
          lato_version=$(grep -oE '^ARG LATO_APK_VERSION=[0-9A-Za-z._-]+' Dockerfile | cut -d= -f2)
          if [ -z "$typst_version" ] || [ -z "$fa_version" ] || [ -z "$lato_version" ]; then
            echo "::error::Could not extract Typst, FA, or Lato version from Dockerfile"
            exit 1
          fi
          tag="typst-${typst_version}-fa-${fa_version}-lato-${lato_version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "full=${IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "Image will be tagged as ${IMAGE_NAME}:${tag}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Skip the login step on PR validation runs — they don't push,
      # and GITHUB_TOKEN on a fork-originating PR can't write packages
      # anyway. Login only when we intend to push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `linux/amd64` only. CI runs amd64; pinning to a single
      # architecture means the rendered PDF bytes are deterministic
      # across local and CI as long as both run amd64 (Apple Silicon
      # users get emulation via Docker Desktop, slower but
      # byte-identical).
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tag.outputs.full }}
          # Buildx GHA cache shaves ~1 min off rebuilds where only
          # the lower (apk / Lato / FA) layers changed. PR-validation
          # runs only read the cache — they don't write back, because
          # feature-branch caches don't propagate to main's scope and
          # would only compete with useful entries under the 10 GiB
          # quota before evicting.
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
