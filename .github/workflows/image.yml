# Builds `ghcr.io/smur89/alta-typst-ci` (Typst + Lato + FontAwesome).
# Pushes on main; PRs build only. The tag is the Makefile's
# DOCKER_IMAGE, which encodes every render-critical version, so a bump
# yields a new immutable tag.
name: Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/image.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/image.yml
  workflow_dispatch:

# Every push to main publishes; other refs cancel superseded runs.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Derived from the Dockerfile so a bump to any of Typst, FA or
      # Lato can't reuse a tag with different bytes. An explicit `bash`
      # adds `pipefail`, so a failed read isn't masked by `tee`.
      - name: Derive image tag from Dockerfile
        id: tag
        shell: bash
        run: make -s toolchain | tee -a "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # PR runs don't push, and a fork PR's token can't write packages.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only, so renders are byte-identical locally and in CI
      # (Apple Silicon emulates).
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tag.outputs.image }}
          # PR runs read the cache but don't write: branch-scoped
          # entries can't be reused by main and would only crowd the
          # 10 GiB quota.
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
