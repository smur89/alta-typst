name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Must match typst.toml's `package.name`; tarball, branch and PR
  # names all derive from it.
  PACKAGE_NAME: altacv
  # Formatter output can shift between versions: bump deliberately and
  # reformat in the same commit (see CONTRIBUTING).
  TYPSTYLE_VERSION: v0.15.2

# An explicit `bash` makes Actions run steps with `-eo pipefail`; the
# implicit default is plain `bash -e`, under which a failing command on
# the left of a pipe (`curl | tar`, `gh pr create | tail`,
# `gh pr list | jq`) is masked by the command on the right.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # In the pinned image the fixtures are committed from (`make
      # docker-pdfs`), so there's no toolchain to install and the drift
      # check compares like with like. Rendering the fixtures is also
      # their compile check, standing in for `make test`'s
      # `test-fixtures`. `-B`: tracked PDFs get checkout-order mtimes,
      # so make could skip them and the gate would compare the committed
      # files to themselves. `-k` reports every failure in one run;
      # `-j4 -O` runs the checks across the runner's four cores, each
      # check's log kept together.
      - name: Render test fixtures, compile examples + template, run panic and unit checks
        run: make in-image TARGETS='-k -B -j4 -O test-pdfs test-compile test-panics test-unit'

      - name: Verify examples/tests/*.pdf are in sync
        run: make check-drift DRIFT_PATHS='examples/tests/*.pdf' DRIFT_FIX='make docker-pdfs'

  # typstyle parses source only, so no Typst or fonts needed.
  format:
    name: typstyle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cached per version: a release download every run is slower, and
      # a GitHub 504 on it would fail the job.
      - name: Restore typstyle
        id: typstyle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/typstyle
          key: typstyle-${{ env.TYPSTYLE_VERSION }}

      - name: Install typstyle
        if: steps.typstyle-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSfL -o ~/.local/bin/typstyle \
            "https://github.com/Enter-tainer/typstyle/releases/download/${TYPSTYLE_VERSION}/typstyle-x86_64-unknown-linux-gnu"
          chmod +x ~/.local/bin/typstyle

      - name: Check formatting
        run: make fmt-check TYPSTYLE="$HOME/.local/bin/typstyle"

  # Rendered output as workflow artifacts for reviewers.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # In the pinned image, as the committed renders are, so the
      # thumbnail can be checked for drift below. Separate uploads so a
      # reviewer downloads one small, named file rather than a bundled
      # zip.
      - name: Build cv.pdf + cv.png + example_full.pdf + thumbnail.png
        run: make docker-release-artifacts

      - name: Verify thumbnail.png is in sync
        if: github.event_name == 'pull_request'
        run: make check-drift DRIFT_PATHS='thumbnail.png' DRIFT_FIX='make docker-preview-images'

      - name: Upload cv.pdf
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cv-pdf
          path: examples/cv.pdf
          retention-days: 30
          if-no-files-found: error

      - name: Upload cv.png
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cv-png
          path: examples/cv.png
          retention-days: 30
          if-no-files-found: error

      - name: Upload example_full.pdf
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-full-pdf
          path: examples/example_full.pdf
          retention-days: 30
          if-no-files-found: error

  # Runs the same checker as typst/packages' CI before a release is
  # cut. Required by branch protection.
  package-check:
    name: typst-package-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pinned so a checker update can't flip the verdict on the same source.
      PCHECK_IMAGE: ghcr.io/typst/package-check:0.6.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release artifacts, the tarball's renders among them, in the
      # pinned image. Also fills .typst-cache (the image's package
      # cache) with @preview deps, which the validate step mounts into
      # the check container.
      - name: Render the release artifacts
        run: make docker-release-artifacts

      # Stage at typst.toml's version so the template's self-import
      # resolves to the staged directory.
      - name: Stage package directory matching the release tarball
        run: |
          PKG_VERSION=$(awk -F'"' '/^version = / {print $2; exit}' typst.toml)
          PKG_DIR=/tmp/pkg-check/packages/preview/${PACKAGE_NAME}/${PKG_VERSION}
          make stage-package-dir PKG_DIR="${PKG_DIR}"
          echo "PKG_VERSION=${PKG_VERSION}" >> "${GITHUB_ENV}"

      - name: Validate package
        # The tool must run from the `packages` subdir. The image has
        # HOME=/, so its Typst looks for the package cache at
        # /.cache/typst/packages.
        run: |
          docker run --rm \
            -v /tmp/pkg-check:/data \
            -v "$PWD/.typst-cache":/.cache/typst/packages:ro \
            --workdir /data/packages \
            ${PCHECK_IMAGE} \
            check @preview/${PACKAGE_NAME}:${PKG_VERSION}

  # release-please-config.json bumps typst.toml's `package.version`
  # as an extra-file, keeping it in lockstep with the tag.
  release-please:
    needs: [lint, format, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  attach-release-artifacts:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Rebuild cv.pdf + cv.png + example_full.pdf + thumbnail.png at the tag
        run: make docker-release-artifacts

      # File list: the Makefile's PACKAGE_FILES. The `examples/*`
      # entries ship only so README links resolve on Universe (typst.toml
      # `exclude`s them from the compiler bundle); a README link to a
      # file not listed there will 404 on Universe.
      - name: Build package tarball
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: make package-tarball PACKAGE_TARBALL="${PACKAGE_NAME}-${VERSION}.tar.gz"

      - name: Attach assets to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            ${{ env.PACKAGE_NAME }}-*.tar.gz
            examples/cv.pdf
            examples/cv.png
            examples/example_full.pdf
          make_latest: 'true'

  # Opens the typst/packages PR for the new version from the
  # smur89/packages fork, branched off upstream main.
  #
  # Prerequisites (one-time setup):
  #   1. Fork github.com/typst/packages to smur89/packages.
  #   2. Create a fine-grained PAT at github.com/settings/personal-access-tokens
  #      scoped to smur89/packages, with:
  #        - Contents: Read and write    (push the branch)
  #        - Pull requests: Read and write  (open the cross-repo PR)
  #      Cross-repo PRs into public typst/packages do not require any
  #      permission on typst/packages itself — read is implicit.
  #   3. Store the PAT as a repository secret named TYPST_UNIVERSE_TOKEN
  #      on smur89/alta-typst.
  #
  # Idempotent: a re-run reuses an already-open PR for the version.
  submit-to-typst-universe:
    needs: [release-please, attach-release-artifacts]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # All writes go to external repos via TYPST_UNIVERSE_TOKEN.
    permissions: {}
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      FORK_REPO: smur89/packages
      UPSTREAM_REPO: typst/packages
      GH_TOKEN: ${{ secrets.TYPST_UNIVERSE_TOKEN }}
    steps:
      - name: Skip if a PR for this version is already open
        id: check
        run: |
          # Filter by head branch: search treats `altacv:` in a title
          # query as an unknown qualifier.
          existing=$(gh pr list \
            --repo "$UPSTREAM_REPO" \
            --head "${FORK_REPO%%/*}:${PACKAGE_NAME}-${VERSION}" \
            --state open \
            --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "PR already open: $existing — skipping submission"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # For the supersede step, whichever run created the PR.
            echo "pr_url=$existing" >> "$GITHUB_OUTPUT"
          fi

      # Uses typst/packages' "update" PR template: this job only opens
      # version bumps (the first submission was manual).
      - name: Checkout PR body template
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/typst-universe-pr-body.md
          sparse-checkout-cone-mode: false

      - name: Configure git
        if: steps.check.outputs.skip != 'true'
        run: |
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Blobless + sparse: the fork mirrors all of typst/packages, and
      # we only touch our own directory. Plain `git clone`, because
      # `gh repo clone` fetches upstream without the filter.
      - name: Clone fork (sparse, blobless) and branch off upstream/main
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone --no-tags --depth=1 --filter=blob:none --sparse \
            "https://github.com/${FORK_REPO}.git" pkg
          cd pkg
          git sparse-checkout set "packages/preview/${PACKAGE_NAME}"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --depth=1 --filter=blob:none upstream main
          git checkout -b "${PACKAGE_NAME}-${VERSION}" upstream/main

      - name: Add package files from the release tarball
        if: steps.check.outputs.skip != 'true'
        env:
          SERVER_URL: ${{ github.server_url }}
        run: |
          cd pkg
          PKG_DIR="packages/preview/${PACKAGE_NAME}/${VERSION}"
          mkdir -p "$PKG_DIR"
          curl -sSfL \
            "${SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${PACKAGE_NAME}-${VERSION}.tar.gz" \
            | tar xz -C "$PKG_DIR"
          git add "$PKG_DIR"
          git commit -m "${PACKAGE_NAME}:${VERSION}"

      # `--force`: only this workflow pushes the per-version branch, and
      # a re-run after a failed PR creation must overwrite it.
      - name: Push branch to fork
        if: steps.check.outputs.skip != 'true'
        run: |
          cd pkg
          git push --force origin "${PACKAGE_NAME}-${VERSION}"

      # envsubst is restricted to named variables so stray `$` refs in
      # the template survive.
      - name: Open PR upstream
        id: open
        if: steps.check.outputs.skip != 'true'
        run: |
          cd pkg
          # Some gh versions print a preamble line before the URL.
          new_pr_url=$(envsubst '${VERSION} ${TAG} ${GITHUB_REPOSITORY}' \
            < "$GITHUB_WORKSPACE/.github/typst-universe-pr-body.md" \
            | gh pr create \
                --repo "$UPSTREAM_REPO" \
                --base main \
                --head "${FORK_REPO%%/*}:${PACKAGE_NAME}-${VERSION}" \
                --title "${PACKAGE_NAME}:${VERSION}" \
                --body-file - \
            | tail -n 1)
          echo "Opened: $new_pr_url"
          echo "pr_url=$new_pr_url" >> "$GITHUB_OUTPUT"

      # The upstream review queue is slower than our releases, so close
      # our older ${PACKAGE_NAME} PRs in favour of the current one.
      #
      # Safety: `--author "@me"` scopes to the TYPST_UNIVERSE_TOKEN
      # identity, and only `${PACKAGE_NAME}-*` head branches match.
      # Caveat: rotating the token to another account orphans PRs
      # opened under the old one; close those manually.
      - name: Supersede earlier package PRs
        env:
          CURRENT_PR_URL: ${{ steps.check.outputs.pr_url || steps.open.outputs.pr_url }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          # `--limit 100` overrides gh's default of 30.
          stale=$(gh pr list \
            --repo "$UPSTREAM_REPO" \
            --author "@me" \
            --state open \
            --limit 100 \
            --json number,headRefName \
            | jq -r --arg cur "${PACKAGE_NAME}-${VERSION}" --arg prefix "${PACKAGE_NAME}-" \
                '.[] | select(.headRefName | startswith($prefix)) | select(.headRefName != $cur) | .number')
          if [ -z "$stale" ]; then
            echo "No older ${PACKAGE_NAME} submissions open — nothing to supersede."
            exit 0
          fi
          release_notes="${SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          body="Closing in favour of \`${PACKAGE_NAME}:${VERSION}\` at ${CURRENT_PR_URL}. The newer release supersedes this submission — see the [release notes](${release_notes}) for the cumulative changes."
          # Warn and continue on a per-PR failure (e.g. closed meanwhile).
          for pr in $stale; do
            if gh pr close "$pr" --repo "$UPSTREAM_REPO" --comment "$body"; then
              echo "Superseded PR #$pr"
            else
              echo "::warning::Could not close PR #$pr (already closed, or transient error) — continuing"
            fi
          done
