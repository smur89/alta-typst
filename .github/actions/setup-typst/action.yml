# Installs the toolchain every CI job that compiles the package needs:
# the Typst binary, the Lato body font, and the FontAwesome desktop
# OTFs that resolve glyphs for `@preview/fontawesome`, plus tytanic for
# a job that runs the visual tests. Extracted into a composite action so
# every job that builds PDFs shares a single source of truth instead of
# duplicating the install block.
#
# The FA zip is restored from cache when available — keyed on the
# version input, so bumping `FA_VERSION` in the workflow invalidates
# the cache automatically.
name: Setup Typst environment
description: Install Typst, Lato, FontAwesome desktop OTFs and optionally tytanic on the runner.

inputs:
  typst-version:
    description: Typst release tag (e.g. v0.15.1).
    required: true
  fa-version:
    description: FontAwesome desktop release version (e.g. 7.0.0).
    required: true
  tytanic-version:
    description: tytanic release version (e.g. 0.4.1); empty skips the install.
    required: false
    default: ''
  tytanic-sha256:
    description: SHA-256 of that release's x86_64 Linux tarball.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Lato
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends fonts-lato

    # Cache the upstream FA zip rather than the unpacked OTFs — the
    # zip is a single ~10 MB blob that restores faster than dozens of
    # small font files, and the unzip + fc-cache steps that follow are
    # cheap.
    - name: Restore FontAwesome zip from cache
      id: fa-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/fa.zip
        key: fontawesome-desktop-${{ inputs.fa-version }}

    - name: Download FontAwesome zip
      if: steps.fa-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FA_VERSION: ${{ inputs.fa-version }}
      run: |
        curl -sSfL -o /tmp/fa.zip \
          "https://github.com/FortAwesome/Font-Awesome/releases/download/${FA_VERSION}/fontawesome-free-${FA_VERSION}-desktop.zip"

    - name: Install FontAwesome OTFs
      shell: bash
      env:
        FA_VERSION: ${{ inputs.fa-version }}
      run: |
        sudo unzip -q -o /tmp/fa.zip -d /tmp/fa
        sudo mkdir -p /usr/share/fonts/fontawesome
        sudo cp "/tmp/fa/fontawesome-free-${FA_VERSION}-desktop/otfs/"*.otf /usr/share/fonts/fontawesome/
        sudo fc-cache -f

    # Renders see only the pinned fonts (and Typst's own), as in the
    # pinned image, so a font the runner happens to have can't change
    # them (the Makefile's FONT_PATHS).
    - name: Pin the font directories
      shell: bash
      run: echo "FONT_PATHS=/usr/share/fonts/truetype/lato:/usr/share/fonts/fontawesome" >> "$GITHUB_ENV"

    - name: Install Typst
      shell: bash
      env:
        TYPST_VERSION: ${{ inputs.typst-version }}
      run: |
        TARBALL=typst-x86_64-unknown-linux-musl.tar.xz
        URL=https://github.com/typst/typst/releases/download/${TYPST_VERSION}/$TARBALL
        curl -sSfL "$URL" | sudo tar -xJ \
          --strip-components=1 \
          -C /usr/local/bin \
          typst-x86_64-unknown-linux-musl/typst

    # Checked against its SHA-256, like the FontAwesome zip.
    - name: Install tytanic
      if: inputs.tytanic-version != ''
      shell: bash
      env:
        TYTANIC_VERSION: ${{ inputs.tytanic-version }}
        TYTANIC_SHA256: ${{ inputs.tytanic-sha256 }}
      run: |
        curl -sSfL -o /tmp/tt.tar.xz \
          "https://github.com/typst-community/tytanic/releases/download/v${TYTANIC_VERSION}/tytanic-x86_64-unknown-linux-musl.tar.xz"
        echo "${TYTANIC_SHA256}  /tmp/tt.tar.xz" | sha256sum -c -
        sudo tar -xJf /tmp/tt.tar.xz -C /usr/local/bin --strip-components=1 tytanic-x86_64-unknown-linux-musl/tt
