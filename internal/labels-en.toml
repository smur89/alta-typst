# Default labels — every display string the template emits. Loaded by
# `internal/defaults.typ` and merged with caller overrides in `alta()`.
# Override any subset via `alta(labels: ...)`; unknown keys panic
# (`internal/validation.typ#_strict_merge`).
#
# Keys mirror JSON Resume's section keys (work, certificates, …) so
# callers think in a single vocabulary. The values are editorial:
# "Experience" reads better than "Work" as a CV heading, "Certifications"
# than "Certificates".
#
# Translators: copy this file, rename it (e.g. labels-de.toml), and
# translate the values. Load it at the call site via:
#   #alta(cv, labels: toml("labels-de.toml"))

# Document language — an ISO 639 code (2–3 lowercase letters, e.g.
# "de", "ga"). Drives hyphenation, smart quotes, and the PDF's
# language tag (read by screen readers). Validated in alta().
lang = "en"

# Section headings.
work         = "Experience"
volunteer    = "Volunteer"
focusAreas   = "Areas of Focus"
skills       = "Skills"
languages    = "Languages"
education    = "Education"
certificates = "Certifications"
publications = "Publications"
awards       = "Awards"
projects     = "Projects"
interests    = "Interests"
references   = "References"
referencesAvailableOnRequest = "References available upon request."

# Deprecated: untyped publications now head from
# `publicationTypes.article`. Still honoured when overridden; removed
# in the next major (#239).
articles = "Articles"

# Cluster heading for projects without an explicit `type`, when at
# least one other project is typed (an all-untyped `projects` list
# renders flat, with no subheadings).
otherProjects = "Other"

# Rendered in date ranges when `endDate` is empty.
present = "Present"

# Footer label when `preferences.lastModifiedFooter` is true.
lastModified = "Last updated"

# Templates rather than prefixes, so a translation can reorder the
# parts. `{…}` placeholders are substituted at render time; unknown
# placeholders panic (validated in alta()).
#
# Page counter in the `pageFooter: "auto"` footer. `{current}` is
# required, `{total}` optional.
pageNumber = "Page {current} / {total}"

# PDF Title metadata. `{name}` (required) is `basics.name`, verbatim.
# A plain string, not markup — write a real em dash, since `---` only
# becomes one in Typst markup.
documentTitle = "{name} — CV"

# Twelve abbreviated month names (January–December). Consumed by the
# built-in `dateFormat: "long"` formatter and the `[month repr:long]` /
# `[month repr:short]` template tokens. Must keep length 12 (validated
# in alta()).
months = [
  "Jan", "Feb", "Mar", "Apr", "May", "Jun",
  "Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
]

# Subheadings for JSON Resume's `publications[].type` codes (untyped
# entries count as `article`). Keys match the `type` string
# case-insensitively; a type with no entry here is printed as given.
# Overrides layer over these defaults.
[publicationTypes]
article = "Articles"
book    = "Books"
patent  = "Patents"
thesis  = "Theses"
talk    = "Talks"

# Per-`publications[].type` icon overrides. Keys match the `type`
# string (case-insensitive); values are utility-icon names. The module
# ships defaults for the type codes (`_code_publication_icons` in
# `sections/publications.typ`) and the deprecated free-text types
# (`_legacy_publication_icons` in `internal/canonical.typ`), and falls
# back to `file` for unknown types. Override here to add a
# custom type or remap a built-in.
[publicationIcons]
